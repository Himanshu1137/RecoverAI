services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recoverai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - recoverai_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/recoverai
      CORS_ORIGIN: http://localhost:5173
      LLM_PROVIDER: mock
      AUTO_SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  recoverai_pgdata:
